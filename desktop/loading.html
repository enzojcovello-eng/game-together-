<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Game Together</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #15130f; color: #f3ece0; font-family: "Segoe UI", system-ui, sans-serif; text-align: center; }
  .box { max-width: 420px; padding: 32px 24px; }
  .brand { font-weight: 800; font-size: 1.6rem; letter-spacing: -0.02em; }
  .brand em { font-style: normal; color: #ff7a1a; }
  .ring { width: 44px; height: 44px; margin: 22px auto; border-radius: 50%; border: 4px solid #35302a; border-top-color: #ff7a1a; animation: spin 1s linear infinite; }
  p { color: #a69e8f; line-height: 1.5; margin: 8px 0; }
  a.btn { display: inline-block; margin-top: 14px; padding: 10px 18px; border-radius: 999px; background: #ff7a1a; color: #1a0f05; font-weight: 700; text-decoration: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="box">
    <div class="brand">game<em>together</em></div>
    <div class="ring"></div>
    <p><strong>Acordando o servidor...</strong></p>
    <p>Quando ninguém usa o site por um tempo, ele dorme e leva de 30 segundos a 1 minuto para voltar. O app tenta de novo sozinho a cada 5 segundos.</p>
    <p>Se demorar muito, confira a internet.</p>
    <a class="btn" href="gt://retry">Tentar agora</a>
  </div>
</body>
</html>
