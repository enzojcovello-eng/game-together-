<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Game Together · Administração</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    main { max-width: 760px; }
    .key { display: flex; gap: 8px; margin: 20px 0; }
    .key input { flex: 1; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--bg-2); color: var(--text); }
    .rep { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--card); margin-bottom: 10px; }
    .rep img, .rep .noimg { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; background: var(--card-2); display: grid; place-items: center; flex: none; }
    .rep .body { flex: 1; min-width: 0; }
    .rep .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .rep .acts button { padding: 7px 10px; font-size: 0.85rem; }
    .rep .danger { border-color: var(--danger); color: var(--danger); }
    .muted { font-size: 0.85rem; }
  </style>
</head>
<body>
  <header class="topbar"><a class="brand" href="/"><span class="brand-name">game<em>together</em></span></a><span class="online">administração</span></header>
  <main>
    <h1>Denúncias</h1>
    <p class="lead">Página só para quem tem a chave de administração (variável <code>ADMIN_KEY</code> no servidor).</p>
    <div class="key"><input type="password" id="key" placeholder="Chave de administração"><button type="button" class="btn-primary" id="load">Entrar</button></div>
    <p class="hint" id="stats"></p>
    <div id="list"></div>
  </main>
  <script>
    const $ = (s) => document.querySelector(s);
    const key = () => $('#key').value.trim();
    try { $('#key').value = sessionStorage.getItem('gt:admin') || ''; } catch (_) {}
    async function load() {
      const r = await fetch('/api/admin/reports', { headers: { 'x-admin-key': key() } });
      if (!r.ok) { $('#list').innerHTML = '<p class="error">Chave inválida ou não configurada.</p>'; return; }
      try { sessionStorage.setItem('gt:admin', key()); } catch (_) {}
      const data = await r.json();
      $('#stats').textContent = `${data.stats.accounts} contas · ${data.stats.banned} banidas · ${data.reports.length} denúncias abertas`;
      const byTarget = new Map();
      for (const rep of data.reports) { if (!byTarget.has(rep.target)) byTarget.set(rep.target, []); byTarget.get(rep.target).push(rep); }
      $('#list').innerHTML = byTarget.size ? '' : '<p class="hint">Nenhuma denúncia aberta.</p>';
      for (const [target, reps] of byTarget) {
        const first = reps[0];
        const div = document.createElement('div');
        div.className = 'rep';
        div.innerHTML = `${first.targetAvatar ? `<img src="${first.targetAvatar}" alt="">` : '<span class="noimg">—</span>'}
          <div class="body">
            <strong>${esc(first.targetName)}</strong> <span class="muted">${first.targetExists ? '' : '(conta já não existe)'}</span>
            <div class="muted">${reps.length} denúncia(s): ${reps.map((r) => `${esc(r.byName)} · ${r.reason}${r.note ? ' · ' + esc(r.note) : ''}`).join(' | ')}</div>
            <div class="acts">
              <button type="button" class="btn-secondary" data-a="remove_photo">Remover foto</button>
              <button type="button" class="btn-secondary danger" data-a="ban">Banir nickname</button>
              <button type="button" class="btn-secondary" data-a="dismiss">Ignorar</button>
            </div>
          </div>`;
        div.querySelectorAll('[data-a]').forEach((b) => b.addEventListener('click', async () => {
          if (b.dataset.a === 'ban' && !confirm(`Banir ${first.targetName}? A conta é apagada e o nickname fica bloqueado.`)) return;
          await fetch('/api/admin/action', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-key': key() }, body: JSON.stringify({ target, action: b.dataset.a }) });
          load();
        }));
        $('#list').appendChild(div);
      }
    }
    function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
    $('#load').addEventListener('click', load);
    $('#key').addEventListener('keydown', (e) => { if (e.key === 'Enter') load(); });
    if (key()) load();
  </script>
</body>
</html>
