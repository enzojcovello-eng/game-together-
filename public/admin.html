<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Game Together · Administração</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    main { max-width: 760px; }
    .key { display: flex; gap: 8px; margin: 20px 0; }
    .key input { flex: 1; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--bg-2); color: var(--text); }
    .rep { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--card); margin-bottom: 10px; }
    .rep img, .rep .noimg { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; background: var(--card-2); display: grid; place-items: center; flex: none; }
    .rep .body { flex: 1; min-width: 0; }
    .rep .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .rep .acts button { padding: 7px 10px; font-size: 0.85rem; }
    .rep .danger { border-color: var(--danger); color: var(--danger); }
    .muted { font-size: 0.85rem; }
    .title-form { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
    .title-form input { padding: 11px 12px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--bg-2); color: var(--text); width: 100%; }
    .title-form .btn-primary { width: 100%; }
    .titled { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .titled li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--bg-2); border: 1px solid var(--border); }
    .titled .who { flex: 1; min-width: 0; }
    .titled .who strong { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .titled .badge-title { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; background: var(--warn); color: var(--accent-ink); font-weight: 800; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; }
    .rm { border: 0; border-radius: 999px; padding: 7px 14px; background: var(--danger); color: #fff; font-weight: 700; font-size: 0.85rem; cursor: pointer; }
    .rm:hover { filter: brightness(1.1); }
  </style>
</head>
<body>
  <header class="topbar"><a class="brand" href="/"><span class="brand-name">game<em>together</em></span></a><span class="online">administração</span></header>
  <main>
    <h1>Denúncias</h1>
    <p class="lead">Página só para quem tem a chave de administração (variável <code>ADMIN_KEY</code> no servidor).</p>
    <div class="key"><input type="password" id="key" placeholder="Chave de administração"><button type="button" class="btn-primary" id="load">Entrar</button></div>
    <p class="hint" id="stats"></p>
    <div class="rep" id="title-box" hidden>
      <div class="body">
        <strong>Títulos ao lado do nickname</strong>
        <div class="muted">Digite o nickname da pessoa e o título (até 16 letras). Para tirar, envie com o título vazio.</div>
        <div class="title-form">
          <input type="text" id="title-name" placeholder="Nickname da pessoa" maxlength="20">
          <input type="text" id="title-text" placeholder="Título (ex.: Dono, Mod, VIP)" maxlength="16" value="Dono">
          <button type="button" class="btn-primary" id="title-btn">Dar título</button>
        </div>
        <div class="muted" id="title-msg"></div>
        <ul class="titled" id="title-list"></ul>
      </div>
    </div>
    <h2 style="font-size:1.1rem;margin:18px 0 10px">Denúncias abertas</h2>
    <div id="list"></div>
  </main>
  <script>
    const $ = (s) => document.querySelector(s);
    const key = () => $('#key').value.trim();
    try { $('#key').value = sessionStorage.getItem('gt:admin') || ''; } catch (_) {}
    async function load() {
      const r = await fetch('/api/admin/reports', { headers: { 'x-admin-key': key() } });
      if (!r.ok) { $('#list').innerHTML = '<p class="error">Chave inválida ou não configurada.</p>'; return; }
      try { sessionStorage.setItem('gt:admin', key()); } catch (_) {}
      const data = await r.json();
      const tt = await fetch('/api/admin/titles', { headers: { 'x-admin-key': key() } }).then((x) => x.json()).catch(() => ({ titles: [] }));
      $('#title-box').hidden = false;
      $('#title-list').innerHTML = (tt.titles || []).length ? tt.titles.map((x) => `<li><span class="who"><strong>${esc(x.name)}</strong><span class="badge-title">${esc(x.title)}</span></span><button type="button" class="rm" data-rm="${esc(x.name)}">tirar</button></li>`).join('') : '<li class="muted">Ninguém tem título ainda.</li>';
      $('#title-list').querySelectorAll('[data-rm]').forEach((b) => b.addEventListener('click', () => setTitle(b.dataset.rm, '')));
      $('#stats').textContent = `${data.stats.accounts} contas · ${data.stats.banned} banidas · ${data.reports.length} denúncias abertas`;
      const byTarget = new Map();
      for (const rep of data.reports) { if (!byTarget.has(rep.target)) byTarget.set(rep.target, []); byTarget.get(rep.target).push(rep); }
      $('#list').innerHTML = byTarget.size ? '' : '<p class="hint">Nenhuma denúncia aberta.</p>';
      for (const [target, reps] of byTarget) {
        const first = reps[0];
        const div = document.createElement('div');
        div.className = 'rep';
        div.innerHTML = `${first.targetAvatar ? `<img src="${first.targetAvatar}" alt="">` : '<span class="noimg">—</span>'}
          <div class="body">
            <strong>${esc(first.targetName)}</strong> <span class="muted">${first.targetExists ? '' : '(conta já não existe)'}</span>
            <div class="muted">${reps.length} denúncia(s): ${reps.map((r) => `${esc(r.byName)} · ${r.reason}${r.note ? ' · ' + esc(r.note) : ''}`).join(' | ')}</div>
            <div class="acts">
              <button type="button" class="btn-secondary" data-a="remove_photo">Remover foto</button>
              <button type="button" class="btn-secondary danger" data-a="ban">Banir nickname</button>
              <button type="button" class="btn-secondary" data-a="dismiss">Ignorar</button>
            </div>
          </div>`;
        div.querySelectorAll('[data-a]').forEach((b) => b.addEventListener('click', async () => {
          if (b.dataset.a === 'ban' && !confirm(`Banir ${first.targetName}? A conta é apagada e o nickname fica bloqueado.`)) return;
          await fetch('/api/admin/action', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-key': key() }, body: JSON.stringify({ target, action: b.dataset.a }) });
          load();
        }));
        $('#list').appendChild(div);
      }
    }
    function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
    $('#load').addEventListener('click', load);
    async function setTitle(name, title) {
      const r = await fetch('/api/admin/title', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-key': key() }, body: JSON.stringify({ name, title }) });
      const d = await r.json().catch(() => ({}));
      $('#title-msg').textContent = r.ok ? (d.title ? `Pronto: ${d.name} agora tem o título "${d.title}".` : `Título de ${d.name} removido.`) : (d.error === 'unknown_user' ? 'Não achei ninguém com esse nickname.' : d.error === 'invalid_title' ? 'Título inválido: use só letras, números e espaços.' : 'Não deu: ' + (d.error || r.status));
      load();
    }
    $('#title-btn').addEventListener('click', () => setTitle($('#title-name').value.trim(), $('#title-text').value.trim()));
    $('#key').addEventListener('keydown', (e) => { if (e.key === 'Enter') load(); });
    if (key()) load();
  </script>
</body>
</html>
